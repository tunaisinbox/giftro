<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Free Robux</title>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;700;900&family=Source+Code+Pro:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Gothic A1', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0e10;
            color: #ffffff;
        }

        /* 重ね合わせ背景 */
        .bg-layer-2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://files.catbox.moe/9mo5ri.jpg') center/cover no-repeat;
            z-index: 1;
        }

        .bg-layer-1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://files.catbox.moe/aq7956.png') center/cover no-repeat;
            z-index: 2;
            opacity: 0.8;
        }

        /* メインコンテナ */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Roblox カードデザイン */
        .roblox-card {
            background: #191B1D;
            border: 1px solid #393B3D;
            border-radius: 12px;
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .card-title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 24px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* 入力フォーム */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #BDC3C7;
            font-weight: 700;
        }

        .roblox-input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            background: #232527;
            border: 1px solid #393B3D;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .roblox-input:focus {
            border-color: #00A2FF;
        }

        .roblox-input.invalid {
            border-color: #ff3b30;
        }

        .input-error-msg {
            color: #ff4d4d;
            font-size: 12px;
            font-weight: 700;
            margin-top: 6px;
            min-height: 16px;
            display: none;
        }

        .input-error-msg.visible {
            display: block;
        }

        /* Robux 選択グリッド */
        .robux-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .robux-option {
            background: #232527;
            border: 1px solid #393B3D;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
        }

        .robux-option:hover {
            background: #2B2D30;
            border-color: #55585C;
        }

        .robux-option.selected {
            border: 2px solid #00E676;
            background: rgba(0, 230, 118, 0.08);
        }

        .robux-option input[type="radio"] {
            display: none;
        }

        .robux-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .robux-amount {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: #00B259;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background: #00C864;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* ローディング画面 */
        .profile-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-bottom: 20px;
        }

        .display-name {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
        }

        .username-tag {
            font-size: 14px;
            color: #8B93A7;
            font-weight: 700;
        }

        .progress-box {
            width: 100%;
            background: #232527;
            border-radius: 6px;
            height: 12px;
            overflow: hidden;
            margin: 14px 0;
            border: 1px solid #393B3D;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #00B259;
            transition: width 0.15s ease-out;
        }

        .status-text {
            font-size: 13px;
            color: #00A2FF;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .terminal-logs {
            width: 100%;
            height: 140px;
            background: #111214;
            border: 1px solid #2B2D30;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Source Code Pro', monospace;
            font-size: 13px;
            color: #00FF66;
            text-align: left;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.4;
        }

        /* トロール画面 */
        #troll-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 9999;
            display: none;
        }

        #troll-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        .troll-popup {
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 440px;
            max-height: 85vh;
            overflow-y: auto;
            background: #191B1D;
            border: 1px solid #ff3b30;
            border-bottom: none;
            border-radius: 16px 16px 0 0;
            padding: 24px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
            transition: bottom 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .troll-popup.active {
            bottom: 0;
        }

        .troll-title {
            font-size: 20px;
            color: #ff3b30;
            font-weight: 900;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .troll-desc {
            font-size: 14px;
            color: #BDC3C7;
            margin-bottom: 16px;
        }

        .sns-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0;
        }

        .sns-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .sns-btn:hover {
            transform: translateY(-2px);
        }

        .sns-btn svg {
            width: 26px;
            height: 26px;
        }

        .btn-line { background: #06C755; }
        .btn-x { background: #000000; border: 1px solid #393B3D; }
        .btn-tiktok { background: #000000; border: 1px solid #393B3D; }
        .btn-message { background: #34C759; }
        .btn-email { background: #007AFF; }
        .btn-share { background: #3A3A3C; }

        .btn-copy {
            width: 100%;
            height: 42px;
            background: #232527;
            border: 1px solid #393B3D;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
        }

        .btn-copy:hover {
            background: #2B2D30;
        }

        .dev-message-box {
            margin-top: 18px;
            padding: 14px;
            background: #232527;
            border: 1px dashed #ff3b30;
            border-radius: 8px;
            text-align: left;
        }

        .dev-title {
            font-size: 13px;
            font-weight: 700;
            color: #ff5252;
            margin-bottom: 6px;
        }

        .dev-content {
            font-size: 12px;
            color: #d1d5e0;
            line-height: 1.5;
        }

        .dev-content b {
            color: #00E676;
        }

        .victim-counter {
            margin-top: 16px;
            font-size: 13px;
            color: #8B93A7;
        }

        .counter-num {
            font-weight: bold;
            color: #ff3b30;
            font-size: 17px;
            font-family: 'Source Code Pro', monospace;
        }

        .hidden { display: none !important; }
    </style>
</head>

            // URLのハッシュ（#en / #jp など）が書き換わった時に即座に言語を切り替える
            window.addEventListener('hashchange', () => {

            const usernameInput = document.getElementById('username');
            usernameInput.addEventListener('input', (e) => {
                let val = e.target.value;
                val = val.replace(/[^a-zA-Z0-9_]/g, '');

                const underscoreMatches = val.match(/_/g);
                if (underscoreMatches && underscoreMatches.length > 1) {
                    let firstIdx = val.indexOf('_');
                    val = val.slice(0, firstIdx + 1) + val.slice(firstIdx + 1).replace(/_/g, '');
                }

                e.target.value = val;
                clearError();
            });

            // 初期表示 & カウンター同期
            setLocalCount(0);
            initRealtimeCounter();
        });

        /* 言語判定・切替ロジック (URLハッシュ > IP/ブラウザ言語) */
        async function initLanguage() {
            if (!checkAndApplyHashLang()) {
                await detectLanguageByIP();
            }
        }

        function checkAndApplyHashLang() {
            const hash = window.location.hash.toLowerCase();
            if (hash === '#en') {
                currentLang = 'en';
                applyLanguage();
                return true;
            } else if (hash === '#jp' || hash === '#ja') {
                currentLang = 'ja';
                applyLanguage();
                return true;
            }
            return false;
        }

        async function detectLanguageByIP() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    const data = await res.json();
                    if (data.country_code && data.country_code !== 'JP') {
                        currentLang = 'en';
                    } else {
                        currentLang = 'ja';
                    }
                } else {
                    fallbackLanguage();
                }
            } catch (e) {
                fallbackLanguage();
            }
            applyLanguage();
        }

        function fallbackLanguage() {
            const userLang = navigator.language || navigator.userLanguage || '';
            if (userLang.indexOf('ja') === -1) {
                currentLang = 'en';
            } else {
                currentLang = 'ja';
            }
        }

        function applyLanguage() {
            const t = TRANSLATIONS[currentLang];
            document.getElementById('i18n-card-title').innerText = t.cardTitle;
            document.getElementById('i18n-label-username').innerText = t.labelUsername;
            document.getElementById('username').placeholder = t.placeholderUsername;
            document.getElementById('i18n-label-amount').innerText = t.labelAmount;
            document.getElementById('i18n-btn-submit').innerText = t.btnSubmit;
            
            document.getElementById('i18n-troll-title').innerText = t.trollTitle;
            document.getElementById('i18n-troll-desc').innerText = t.trollDesc;
            document.getElementById('i18n-btn-copy').innerText = t.btnCopy;
            document.getElementById('i18n-dev-title').innerText = t.devTitle;
            document.getElementById('i18n-dev-content').innerHTML = t.devContent;
            document.getElementById('i18n-victim-label').innerText = t.victimLabel;
            document.getElementById('i18n-victim-unit').innerText = t.victimUnit;
        }

        function showError(message) {
            const errorEl = document.getElementById('username-error');
            const inputEl = document.getElementById('username');
            errorEl.innerText = message;
            errorEl.classList.add('visible');
            inputEl.classList.add('invalid');
        }

        function clearError() {
            const errorEl = document.getElementById('username-error');
            const inputEl = document.getElementById('username');
            errorEl.innerText = '';
            errorEl.classList.remove('visible');
            inputEl.classList.remove('invalid');
        }

        function validateRobloxUsername(val) {
            const t = TRANSLATIONS[currentLang];
            if (!val || val.length === 0) return t.errEmpty;
            if (val.length < 3) return t.errShort;
            if (val.startsWith('_')) return t.errStartUnderscore;
            if (val.endsWith('_')) return t.errEndUnderscore;
            const underscoreCount = (val.match(/_/g) || []).length;
            if (underscoreCount > 1) return t.errMultiUnderscore;
            return null;
        }

        function selectOption(el) {
            document.querySelectorAll('.robux-option').forEach(opt => opt.classList.remove('selected'));
            el.closest('.robux-option').classList.add('selected');
        }

        function validateAndStart() {
            const usernameInput = document.getElementById('username').value.trim();
            const errorMsg = validateRobloxUsername(usernameInput);

            if (errorMsg) {
                showError(errorMsg);
                return;
            }

            clearError();
            startProcess(usernameInput);
        }

        async function startProcess(usernameInput) {
            const video = document.getElementById('troll-video');
            
            video.load();
            try {
                video.muted = true;
                await video.play();
                video.pause();
                video.currentTime = 0;
            } catch (e) {}

            document.getElementById('step-form').classList.add('hidden');
            document.getElementById('step-loading').classList.remove('hidden');

            document.getElementById('user-tag').innerText = `@${usernameInput}`;
            document.getElementById('user-displayname').innerText = usernameInput;

            fetchRobloxUserData(usernameInput);
            runTwoPhaseProgress();
        }

        /* 2段階のプログレス制御
           Phase 1: 15秒 (0% -> 10%) 設定したPrefix (tuna等) スピナー回転
           Phase 2: 30秒 (10% -> 100%) ランダムログ・プログレス進行
        */
        function runTwoPhaseProgress() {
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('status-text');
            const terminal = document.getElementById('terminal');
            const t = TRANSLATIONS[currentLang];

            const phase1Time = 15000;
            const phase2Time = 30000;
            const phase1StartTime = Date.now();

            const spinnerFrames = ['|', '/', '-', '\\'];
            let spinnerIdx = 0;

            spinnerInterval = setInterval(() => {
                terminal.innerText = `${CONFIG.terminalPrefix} ${spinnerFrames[spinnerIdx]}`;
                spinnerIdx = (spinnerIdx + 1) % spinnerFrames.length;
            }, 120);

            let phase2Started = false;
            let currentProgress = 0;
            let phase2StartTime = 0;

            function update() {
                const now = Date.now();

                if (!phase2Started) {
                    const elapsedP1 = now - phase1StartTime;
                    if (elapsedP1 <= phase1Time) {
                        currentProgress = (elapsedP1 / phase1Time) * 10;
                        progressBar.style.width = `${currentProgress.toFixed(1)}%`;
                        statusText.innerText = `${t.statusConnecting} (${Math.floor(currentProgress)}%)`;
                    } else {
                        phase2Started = true;
                        phase2StartTime = now;
                        clearInterval(spinnerInterval);
                        terminal.innerText = "";
                        startFastTerminalLogs();
                    }
                }

                if (phase2Started) {
                    const elapsedP2 = now - phase2StartTime;
                    const remainingTime = phase2Time - elapsedP2;

                    if (remainingTime > 0) {
                        const targetRemainingProgress = 100 - currentProgress;
                        const baseSpeed = targetRemainingProgress / remainingTime;
                        
                        const rand = Math.random();
                        let multiplier = 1.0;

                        if (rand < 0.20) {
                            multiplier = Math.random() * 0.15;
                        } else if (rand > 0.82) {
                            multiplier = 2.5 + Math.random() * 1.5;
                        } else {
                            multiplier = 0.6 + Math.random() * 0.8;
                        }

                        currentProgress += baseSpeed * 16 * multiplier;
                        if (currentProgress > 99.8) currentProgress = 99.8;

                        progressBar.style.width = `${currentProgress.toFixed(1)}%`;

                        if (currentProgress < 45) {
                            statusText.innerText = `${t.statusConnecting} (${Math.floor(currentProgress)}%)`;
                        } else if (currentProgress < 80) {
                            statusText.innerText = `${t.statusGenerating} (${Math.floor(currentProgress)}%)`;
                        } else {
                            statusText.innerText = `${t.statusTransferring} (${Math.floor(currentProgress)}%)`;
                        }
                    } else {
                        progressBar.style.width = '100%';
                        statusText.innerText = t.statusComplete;
                        statusText.style.color = "#00B259";

                        setTimeout(() => {
                            clearInterval(logInterval);
                            triggerTroll();
                        }, CONFIG.finishBufferDelayMs);
                        return;
                    }
                }

                requestAnimationFrame(update);
            }

            requestAnimationFrame(update);
        }

        async function fetchRobloxUserData(username) {
            try {
                const res = await fetch(`https://corsproxy.io/?https://users.roblox.com/v1/usernames/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
                });
                const data = await res.json();

                if (data.data && data.data.length > 0) {
                    const user = data.data[0];
                    document.getElementById('user-displayname').innerText = user.displayName;
                }
            } catch (err) {}
        }

        /* 時刻(HH:mm:ss)を生成するヘルパー関数 */
        function getTimeString() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function startFastTerminalLogs() {
            const terminal = document.getElementById('terminal');
            const logTemplates = [
                "FETCH https://api.roblox.com/v1/user/auth HTTP/1.1 200 OK",
                "ALLOCATE_MEMORY_BLOCK 0x7FFF" + Math.floor(Math.random()*16777215).toString(16).toUpperCase(),
                "BYPASS_SSL_PINNING_MODULE -> ACTIVE",
                "HOOK_PACKET_STREAM id=" + Math.floor(Math.random()*90000 + 10000),
                "AES_256_CBC_ENCRYPT key=" + Math.random().toString(36).substring(2, 10),
                "INJECT_SQL_PAYLOAD INTO tbl_robux_wallets VALUES (amount)",
                "DEOBFUSCATING lua_script_chunk_" + Math.floor(Math.random()*99),
                "AUTHENTICATE_HANDSHAKE token=" + Math.random().toString(36).substring(2, 12),
                "OVERRIDING_ANTI_CHEAT_INTEGRITY_CHECK...",
                "PING server.rbx.com [127.0.0.1] 12ms",
                "PARSING_DATAPACKET_HEADER_RESPONSE_CODE_200"
            ];

            logInterval = setInterval(() => {
                const randomLine = logTemplates[Math.floor(Math.random() * logTemplates.length)];
                const timestamp = getTimeString(); // [15:04:05] 時:分:秒
                
                terminal.innerText += `${terminal.innerText ? '\n' : ''}[${timestamp}] ${randomLine}`;
                terminal.scrollTop = terminal.scrollHeight;
            }, 80);
        }

        function triggerTroll() {
            const trollScreen = document.getElementById('troll-screen');
            const video = document.getElementById('troll-video');
            const popup = document.getElementById('troll-popup');

            trollScreen.style.display = 'block';
            video.currentTime = 0;

            video.muted = false;
            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    video.muted = true;
                    video.play();

                    const unmuteHandler = () => {
                        video.muted = false;
                        document.removeEventListener('click', unmuteHandler);
                        document.removeEventListener('touchstart', unmuteHandler);
                    };
                    document.addEventListener('click', unmuteHandler);
                    document.addEventListener('touchstart', unmuteHandler);
                });
            }

            setTimeout(() => {
                popup.classList.add('active');
            }, CONFIG.revealDelaySeconds * 1000);

            incrementRealtimeCounter();
        }

        /* カウンター API */
        function getLocalCount() {
            return parseInt(localStorage.getItem('roblox_victim_count') || '0', 10);
        }

        function setLocalCount(val) {
            localStorage.setItem('roblox_victim_count', val.toString());
            document.getElementById('counter-val').innerText = val.toLocaleString();
        }

        async function initRealtimeCounter() {
            try {
                let res = await fetch(`https://api.counterapi.dev/v1/${CONFIG.apiNamespace}/${CONFIG.apiKey}`);
                if (res.status === 404) {
                    await fetch(`https://api.counterapi.dev/v1/${CONFIG.apiNamespace}/${CONFIG.apiKey}/create`);
                    res = await fetch(`https://api.counterapi.dev/v1/${CONFIG.apiNamespace}/${CONFIG.apiKey}`);
                }
                if (res.ok) {
                    const data = await res.json();
                    if (data && typeof data.count === 'number') {
                        setLocalCount(data.count);
                    }
                }
            } catch (e) {}
        }

        async function incrementRealtimeCounter() {
            let current = getLocalCount();
            setLocalCount(current + 1);

            try {
                let res = await fetch(`https://api.counterapi.dev/v1/${CONFIG.apiNamespace}/${CONFIG.apiKey}/up`);
                if (res.status === 404) {
                    await fetch(`https://api.counterapi.dev/v1/${CONFIG.apiNamespace}/${CONFIG.apiKey}/create`);
                    res = await fetch(`https://api.counterapi.dev/v1/${CONFIG.apiNamespace}/${CONFIG.apiKey}/up`);
                }
                if (res.ok) {
                    const data = await res.json();
                    if (data && typeof data.count === 'number') {
                        setLocalCount(data.count);
                    }
                }
            } catch (e) {}
        }

        /* テキスト＆URLの同時コピー処理 */
        function getCleanUrl() {
            return window.location.href.split('#')[0];
        }

        function copyShareText() {
            const t = TRANSLATIONS[currentLang];
            const rawUrl = getCleanUrl();
            const textToCopy = `${t.shareMessage}\n${rawUrl}`; // 文章 + 改行 + URL

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showError(t.textCopied);
                }).catch(() => {
                    fallbackCopyText(textToCopy);
                });
            } else {
                fallbackCopyText(textToCopy);
            }
        }

        function fallbackCopyText(text) {
            const t = TRANSLATIONS[currentLang];
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showError(t.textCopied);
            } catch (err) {}
            document.body.removeChild(textarea);
        }

        /* 各種SNS共有 */
        function shareTo(platform) {
            const t = TRANSLATIONS[currentLang];
            const rawUrl = getCleanUrl();
            const text = encodeURIComponent(t.shareMessage);
            const url = encodeURIComponent(rawUrl);

            switch (platform) {
                case 'line':
                    window.open(`https://social-plugins.line.me/lineit/share?url=${url}&text=${text}`, '_blank');
                    break;
                case 'x':
                    window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
                    break;
                case 'tiktok':
                    copyShareText();
                    window.open("https://www.tiktok.com/", "_blank");
                    break;
                case 'message':
                    window.location.href = `sms:?body=${text}%20${url}`;
                    break;
                case 'email':
                    window.location.href = `mailto:?subject=${encodeURIComponent("Free Robux")}&body=${text}%20${url}`;
                    break;
                case 'share':
                default:
                    if (navigator.share) {
                        navigator.share({
                            title: 'Get Free Robux',
                            text: t.shareMessage,
                            url: rawUrl,
                        }).catch(() => {});
                    } else {
                        copyShareText();
                    }
                    break;
            }
        }
    </script>
